[[define "content"]]
<section class="bg-white p-6 rounded-2xl shadow-sm space-y-4">
    <div>
        <h2 class="text-2xl font-semibold text-gray-800">페이지 선택</h2>
        <p class="text-sm text-gray-500 mt-1">접근 가능한 관리자 페이지를 선택하세요.</p>
    </div>

    [[if .MenuItems]]
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
        [[range .MenuItems]]
        <a
            href="[[.Path]]"
            class="block p-4 border border-gray-200 rounded-xl hover:border-indigo-400 hover:bg-indigo-50 transition no-underline"
        >
            <div class="flex items-center gap-3">
                <span class="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-700 font-semibold flex items-center justify-center">[[.Icon]]</span>
                <div>
                    <div class="text-sm font-semibold text-gray-800">[[.Title]]</div>
                </div>
            </div>
        </a>
        [[end]]
    </div>
    [[else]]
    <div class="p-4 rounded-xl border border-amber-200 bg-amber-50 text-amber-800 text-sm">
        접근 가능한 페이지 권한이 없습니다. 최고관리자에게 권한 할당을 요청하세요.
    </div>
    [[end]]
</section>
[[end]]
